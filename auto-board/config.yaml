name: auto-board
version: 0.1.0
slug: auto_board
description: 米家极客版 + Home Assistant 双源自动化看板（清单/日志/触发统计/带审计撤回的启停）
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
# 不使用 ingress：Next.js 静态资源是根绝对路径（/_next/...），
# 经 ingress 的 /api/hassio_ingress/<token>/ 子路径访问会 404 白屏。
# 改为直连端口 + webui 按钮；如需侧边栏入口，用 panel_iframe 指向同一地址。
ports:
  3423/tcp: 3423
ports_description:
  3423/tcp: 看板网页端口
webui: http://[HOST]:[PORT:3423]
panel_icon: mdi:home-automation
panel_title: auto-board
options:
  gateway_url: ""
  board_token: ""
schema:
  gateway_url: str?
  board_token: str?
